<!doctypehtml><html lang=pt-BR><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Provisionamento Wi-Fi</title><style>body{font-family:Arial,sans-serif;margin:0;padding:0;background:#fafafa;display:flex;flex-direction:column;align-items:center}header{width:100%;background:#2c3e50;color:#fff;padding:15px;text-align:center;font-size:24px;font-weight:700}.container{margin-top:20px;width:80%;max-width:420px;background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}button{width:100%;padding:10px;background:#3498db;color:#fff;font-size:16px;border:none;border-radius:5px;cursor:pointer}button:hover{background:#2980b9}input,select{width:100%;padding:10px;margin-top:8px;margin-bottom:15px;font-size:16px;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}label{font-size:14px;color:#555}.show-pass{display:flex;align-items:center;gap:6px}.show-pass input{width:auto;margin:0}</style><body onload=scan()><header>Provisionamento Wi-Fi</header><div class=container><label>Rede Wi-Fi</label> <select id=ssid></select> <label>Senha</label> <input id=pass type=password><div class=show-pass><input id=showPass type=checkbox onclick=togglePass(this)> <label for=showPass>Mostrar senha</label></div><button onclick=save() style=margin-top:20px>Salvar</button> <button onclick=scan() style=margin-top:20px>Buscar redes</button></div><script>function scan(){fetch("/scan").then(function(e){return e.json()}).then(function(e){var n=document.getElementById("ssid");n.innerHTML="",e.sort(function(e,n){return n.rssi-e.rssi});for(var t=0;t<e.length;t++){var s=e[t],o=document.createElement("option");o.value=s.ssid,o.text=s.ssid+" ("+s.rssi+" dBm)",n.appendChild(o)}})}function togglePass(e){document.getElementById("pass").type=e.checked?"text":"password"}function save(){var e=document.getElementById("ssid").value,n=document.getElementById("pass").value;fetch("/save",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"ssid="+encodeURIComponent(e)+"&pass="+encodeURIComponent(n)}).then(function(){alert("Credenciais enviadas")})}window.addEventListener("load",function(){scan()})</script>

<meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1">
<title>Controle do Dispositivo</title>
<style>
  *{box-sizing:border-box}
  html,body,input{background:#0f2b36}
  html,body{margin:0;padding:0;font-family:Arial,sans-serif;color:#d5e6ee}
  .app-wrapper{max-width:480px;width:100%;margin:0 auto;min-height:100vh;padding:10px 0}
  .center,input{text-align:center}
  .flex{display:flex}
  .jc{justify-content:center}
  .g12{gap:12px}
  .g10{gap:10px}
  .mb10{margin-bottom:10px}
  .mt15{margin-top:15px}
  .card{background:#113f50;margin:12px;padding:16px;border-radius:8px}
  .title{font-size:24px}
  .line{display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px}
  .red-text{color:#ff5555;font-weight:bold}
  .btn,input{color:#fff}
  .btn{width:70px;height:60px;border:none;border-radius:14px;font-size:18px;background:#1a6f97;cursor:pointer}
  input{width:60px;padding:10px;border-radius:8px;border:1px solid #4b6a78}
  .nameInput{display:none;width:80%;font-size:22px}
  .white{background:#e6e6e6;color:#1670c9}
  .reset{width:100%;padding:12px;border:none;border-radius:8px;background:#e6e6e6;color:#1670c9;font-size:16px;cursor:pointer}
  .switch input{display:none}
  .switch{position:relative;width:44px;height:22px;display:inline-block}
  .slider{position:absolute;inset:0;background:#2a4d5b;border-radius:20px;cursor:pointer}
  .slider:before{content:"";position:absolute;height:18px;width:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
  input:checked+.slider{background:#1a6f97}
  input:checked+.slider:before{transform:translateX(22px)}
  .btn-power-container{display:flex;justify-content:center;align-items:center;padding:40px 0}
  .btn-power{width:120px;height:120px;border-radius:50%;border:none;font-size:80px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.3);display:flex;justify-content:center;align-items:center;line-height:0;transition:background .3s,color .3s}
  .btn-power.off{background:#2a4d5b;color:#0f2b36}
  .btn-power.on{background:#e6e6e6;color:#1a6f97}
</style>

<div class="app-wrapper">
  <div class="card center">
    <span id="nameText" class="title">Carregando...</span>
    <button id="editName" style="background:transparent;border:none;color:#d5e6ee;font-size:18px">✏️</button>
    <input id="nameInput" class="nameInput">
  </div>

  <div id="appContainer">
    <div class="card layout-ventilador">
      <div class="flex jc g12 mt15 mb10">
        <button class="btn" id="off">OFF</button>
        <button class="btn" id="v1">1</button>
        <button class="btn" id="v2">2</button>
        <button class="btn" id="v3">3</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="center">⏱ Configurar Temporizador</div>
    <div class="flex jc g10 mt15">
      <input id="th" placeholder="Horas">
      <input id="tm" placeholder="Min">
      <button class="btn" id="timerState">OFF</button>
      <button class="btn" id="tset">✓</button>
    </div>
    <div id="timerLabel" class="center mt15"></div>
  </div>

  <div class="card">
    <div class="center mb10">Detalhes</div>
    <div class="line">
      <span>Status na inicialização</span>
      <label class="switch"><input type="checkbox" id="startState"><span class="slider"></span></label>
    </div>
    <div class="line">
      <span>Atualização OTA</span>
      <label class="switch"><input type="checkbox" id="otaState"><span class="slider"></span></label>
    </div>
    <div class="line" id="tempLine" style="display:none">
      <span>Temperatura:</span><span id="tempVal"></span>
    </div>
    <div class="line red-text" id="shutdownLine" style="display:none">
      <span>Desligamentos por temp. alta:</span><span id="shutdownCountVal"></span>
    </div>
    <div class="line" id="ssidLine" style="display:none">
      <span>Rede Wi-Fi:</span><span id="ssidVal"></span>
    </div>
    <div class="line" id="wifiLine" style="display:none">
      <span>Sinal Wi-Fi:</span><span id="wifiVal"></span>
    </div>
    <div class="line">Unique ID: <span id="uid"></span></div>
    <div class="line">Versão do software: <span id="ver"></span></div>
  </div>

  <div class="card">
    <div class="center mb10">Resetar configurações</div>
    <button class="reset" id="reset">Resetar!</button>
  </div>
</div>

<script>
  const API = "/api/a/lights/1";
  const $ = id => document.getElementById(id);

  let ventiladorHTML = "";
  let timerOn = false;

  function put(url, data) {
    return fetch(API + url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
  }

  function sendState(isOn, brightness) {
    put("/state", { on: isOn, bri: brightness }).then(loadState);
  }

  function setActive(isOn, brightness) {
    if ($("off") && $("v1") && $("v2") && $("v3")) {
      $("off").classList.remove("white");
      $("v1").classList.remove("white");
      $("v2").classList.remove("white");
      $("v3").classList.remove("white");

      if (isOn) {
        if (brightness <= 85) $("v1").classList.add("white");
        else if (brightness <= 170) $("v2").classList.add("white");
        else $("v3").classList.add("white");
      } else {
        $("off").classList.add("white");
      }
    }
  }

  function loadState() {
    fetch(API)
      .then(res => res.json())
      .then(data => {
        let state = data.state;

        if (data.psrtype === "PLUG") {
          renderPlugLayout(state.on);
        } else {
          $("appContainer").innerHTML = ventiladorHTML;
          setupVentiladorEvents();
          setActive(state.on, state.bri);
        }

        updateTimerLabel(state.minutes, state.timerState);
        $("startState").checked = state.startState === true || state.startState === "true";
        $("otaState").checked = state.otaState === true || state.otaState === "true";
        $("nameText").innerText = data.name;
        $("uid").innerText = data.uniqueid;
        $("ver").innerText = data.swversion;

        let temp = state.temperature !== undefined ? state.temperature : data.temperature;
        let tempLine = $("tempLine");
        let tempVal = $("tempVal");

        if (temp === -999) {
          tempLine.style.display = "flex";
          tempVal.innerText = "erro de leitura";
        } else if (temp !== undefined && temp !== -1) {
          tempLine.style.display = "flex";
          tempVal.innerText = temp + " °C";
        } else {
          tempLine.style.display = "none";
        }

        let ssid = state.wifiSsid !== undefined ? state.wifiSsid : data.wifiSsid;
        let ssidLine = $("ssidLine");
        let ssidVal = $("ssidVal");

        if (ssid !== undefined && ssid !== null && ssid !== "") {
          ssidLine.style.display = "flex";
          ssidVal.innerText = ssid;
        } else {
          ssidLine.style.display = "none";
        }

        let wifi = state.wifiSignal;
        let wifiLine = $("wifiLine");
        let wifiVal = $("wifiVal");

        if (wifi !== undefined && wifi !== null) {
          wifiLine.style.display = "flex";
          let label = wifi >= -50 ? "🟢 Ótimo" : wifi >= -60 ? "🟢 Bom" : wifi >= -70 ? "🟡 Razoável" : wifi >= -80 ? "🟠 Fraco" : "🔴 Muito fraco";
          wifiVal.innerText = `${label} (${wifi} dBm)`;
        } else {
          wifiLine.style.display = "none";
        }

        let shutdownCount = state.thermalShutdownCount !== undefined ? state.thermalShutdownCount : data.thermalShutdownCount;
        let shutdownLine = $("shutdownLine");
        let shutdownCountVal = $("shutdownCountVal");

        if (shutdownCount && shutdownCount > 0) {
          shutdownLine.style.display = "flex";
          shutdownCountVal.innerText = shutdownCount;
        } else {
          shutdownLine.style.display = "none";
        }
      });
  }

  function renderPlugLayout(isOn) {
    const statusClass = isOn ? "on" : "off";
    $("appContainer").innerHTML = `
      <div class="card btn-power-container">
        <button id="plugPowerBtn" class="btn-power ${statusClass}">⏻</button>
      </div>
    `;

    $("plugPowerBtn").onclick = () => sendState(!isOn, isOn ? 0 : 255);
  }

  function setupVentiladorEvents() {
    if (!$("off")) return;
    $("off").onclick = () => sendState(false, 0);
    $("v1").onclick = () => sendState(true, 1);
    $("v2").onclick = () => sendState(true, 170);
    $("v3").onclick = () => sendState(true, 255);
  }

  function setupTimerEvents() {
    const timerBtn = $("timerState");
    if (timerBtn) {
      timerBtn.onclick = () => {
        timerBtn.classList.add("white");
        timerOn = true;
        let curText = timerBtn.innerText;
        timerBtn.innerText = curText === "OFF" ? 1 : curText == 1 ? 2 : curText == 2 ? 3 : "OFF";

        if (timerBtn.innerText === "OFF") {
          timerOn = false;
          timerBtn.classList.remove("white");
        }
      };
    }

    if ($("tset")) {
      $("tset").onclick = () => {
        let h = $("th").value;
        let m = $("tm").value;
        if (!h && !m) return;

        let totalMinutes = (+m || 0) + (+h || 0) * 60;
        let bri = 0;

        if ($("v1") && $("v1").classList.contains("white")) bri = 1;
        else if ($("v2") && $("v2").classList.contains("white")) bri = 170;
        else if ($("v3") && $("v3").classList.contains("white")) bri = 255;
        else if ($("plugPowerBtn") && $("plugPowerBtn").classList.contains("on")) bri = 255;

        put("/timer", { on: timerOn, minutes: totalMinutes, bri: bri });
        loadState();
      };
    }
  }

  const nameText = $("nameText");
  const nameInput = $("nameInput");
  const editBtn = $("editName");

  function saveName() {
    let val = nameInput.value.trim();
    nameInput.style.display = "none";
    nameText.style.display = "inline";
    editBtn.style.display = "inline";
    if (val) {
      nameText.innerText = val;
      put("/rename", { name: val });
    }
  }

  editBtn.onclick = () => {
    nameInput.value = nameText.innerText;
    nameText.style.display = "none";
    editBtn.style.display = "none";
    nameInput.style.display = "inline";
    nameInput.focus();
  };

  nameInput.onblur = saveName;
  nameInput.onkeydown = e => {
    if (e.key === "Enter") {
      e.preventDefault();
      nameInput.blur();
    }
  };

  function updateTimerLabel(minutes, isTimerActive) {
    if (!$("timerLabel") || minutes == -1) {
      if ($("timerLabel")) $("timerLabel").innerText = "";
      return;
    }

    let targetDate = new Date(Date.now() + minutes * 60000);
    let today = new Date();
    let msg = "O dispositivo será " + (isTimerActive ? "ligado" : "desligado");

    if (targetDate.getDate() > today.getDate()) {
      msg += " em " + targetDate.toLocaleDateString();
    }

    $("timerLabel").innerText = msg + " às " + targetDate.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + ".";
  }

  $("startState").onchange = async function() {
    let oldState = !this.checked;
    try {
      let res = await put("/startState", { state: this.checked });
      let data = await res.json();
      if (!res.ok || data.message !== "Sucesso!") this.checked = oldState;
    } catch {
      this.checked = oldState;
    }
  };

  $("otaState").onchange = async function() {
    let oldState = !this.checked;
    try {
      let res = await put("/otaState", { state: this.checked });
      let data = await res.json();
      if (!res.ok || data.message !== "Sucesso!") this.checked = oldState;
    } catch {
      this.checked = oldState;
    }
  };

  $("reset").onclick = async function() {
    if (confirm("Tem certeza que deseja resetar as configurações?")) {
      try {
        let res = await put("/reset", { key: "f635g2vg3gn54H$" });
        let data = await res.json();
        if (data.message === "Sucesso!") {
          alert("Dispositivo resetado com sucesso!");
          window.location.href = "https://www.google.com";
        } else {
          alert("Falha ao resetar o dispositivo.");
        }
      } catch (err) {
        alert("Erro ao comunicar com o dispositivo.");
      }
    }
  };

  // Inicialização segura após carregar o DOM
  window.onload = () => {
    ventiladorHTML = $("appContainer").innerHTML;
    setupTimerEvents();
    loadState();
  };
</script>
